name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@12.2.3
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit signatures
      - run: npm run check
      - run: sh -n install.sh
      - name: Validate PowerShell installer syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/install.ps1", [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - run: npm run pack:release
      - run: (cd dist && sha256sum -c SHA256SUMS)
      - name: Smoke-test release archive
        run: |
          prefix="${RUNNER_TEMP}/gemini-github-mcp-install"
          npm install --global --prefix "$prefix" \
            --allow-scripts=esbuild,fsevents,workerd \
            "${GITHUB_WORKSPACE}/dist/gemini-github-mcp-proxy.tgz"
          test "$("${prefix}/bin/gemini-github-mcp" --version)" = "$(node -p "require('./package.json').version")"
